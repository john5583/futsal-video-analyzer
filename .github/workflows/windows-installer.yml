name: Futsal Analyzer — installeur Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. 1.1.0) ; laisser vide pour seulement compiler"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Numéro de version = étiquette (publication uniquement)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          $v = if ($env:VERSION_INPUT) { $env:VERSION_INPUT } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          npm version "$v" --no-git-tag-version --allow-same-version
      - name: Tests (téléchargent le modèle et une photo d'essai)
        run: npm test
      - name: Construire l'installeur
        run: npm run dist
      - name: Vérifier le contenu de l'application
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not (Test-Path dist/latest.yml)) { throw "latest.yml manquant (mise à jour automatique)" }
          if (-not $exe -or $exe.Length -lt 100MB) { throw "Installeur introuvable ou trop petit" }
          Write-Host "Installeur : $($exe.Name) ($([math]::Round($exe.Length/1MB)) Mo)"
          $res = "dist/win-unpacked/resources"
          foreach ($f in @("models/yolox_s.onnx", "models/mobile_sam_encoder.onnx", "models/mobile_sam_decoder.onnx", "app.asar", "app.asar.unpacked/src/ai/worker.js", "app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v3/win32/x64/onnxruntime_binding.node", "app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v3/win32/x64/onnxruntime.dll")) {
            if (-not (Test-Path "$res/$f")) { throw "Fichier manquant dans l'application : $f" }
          }
          if (Test-Path "$res/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v3/linux") { throw "Binaires Linux inclus par erreur" }
      - name: Version portable (sans installation)
        shell: pwsh
        run: Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/Futsal-Analyzer-Portable.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Futsal-Analyzer-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Futsal-Analyzer-Portable
          path: dist/Futsal-Analyzer-Portable.zip
          if-no-files-found: error
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: Futsal Analyzer ${{ inputs.version != '' && inputs.version || github.ref_name }}
          files: |
            dist/*Setup*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/Futsal-Analyzer-Portable.zip
