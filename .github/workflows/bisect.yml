name: Recherche de la cause (temporaire)
on:
  push:
    branches: ["bisect-*"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/get-assets.js
      - run: npm i --no-save playwright-core@1.49.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Terrain recale sur les vraies lignes
        run: xvfb-run -a node tests/e2e/lignes-recalage.js
        env:
          CI: "true"
