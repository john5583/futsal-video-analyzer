name: Test de bout en bout (Linux)
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/get-assets.js
      - run: npm i --no-save playwright-core@1.49.0
      - name: Démarrage de l'application et découpe réelle
        run: xvfb-run -a node tests/e2e/segment-ipc.js
        env:
          CI: "true"
      - name: Installer ffmpeg (génération de la vidéo d'essai)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Assistant complet (vidéo d'essai avec but, vrai modèle de découpe)
        run: xvfb-run -a node tests/e2e/wizard-goal.js
        env:
          CI: "true"
      - name: Questions du programme, mémoire du projet, Mes réponses (annuler), cadre orange
        run: xvfb-run -a node tests/e2e/questions.js
        env:
          CI: "true"
      - name: Corriger une personne ou le ballon en un clic (menu, annulation, même gardien proposé)
        run: xvfb-run -a node tests/e2e/correct-click.js
        env:
          CI: "true"
      - name: Page Mon plan tactique (questions, comparaison au match, écarts sur la vidéo)
        run: xvfb-run -a node tests/e2e/plan.js
        env:
          CI: "true"
      - name: Correction animée sur la vraie vidéo (dessins, repli caméra perdue, modes)
        run: xvfb-run -a node tests/e2e/correction-video.js
        env:
          CI: "true"
      - name: Ecran Etiquetage (ballon, joueurs, enregistrement immediat, reprise apres redemarrage)
        run: xvfb-run -a node tests/e2e/etiquetage.js
        env:
          CI: "true"
      - name: Analyse v2 (beta), case a cocher, couverture, validation et rejet des regles
        run: xvfb-run -a node tests/e2e/analyse-v2.js
        env:
          CI: "true"
